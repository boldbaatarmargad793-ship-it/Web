<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дэвтэр — хичээлийн тэмдэглэл</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF1F8; --paper:#FFFFFF; --ink:#1B2540; --muted:#5B6987; --line:#D6DEEC;
  --accent:#2F5BEA; --accent-ink:#FFFFFF; --margin:#E5484D; --grid:rgba(47,91,234,.07);
  --danger:#C92A34; --rule:#E3E9F4;
  --hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424; --paper:#172036; --ink:#E8EDF9; --muted:#9AA7C7; --line:#2A3556;
    --accent:#7F9FFF; --accent-ink:#0E1424; --grid:rgba(127,159,255,.07); --danger:#FF7B84; --rule:#243052;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1424; --paper:#172036; --ink:#E8EDF9; --muted:#9AA7C7; --line:#2A3556;
  --accent:#7F9FFF; --accent-ink:#0E1424; --grid:rgba(127,159,255,.07); --danger:#FF7B84; --rule:#243052;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; min-height:100%; font-family:var(--sans); font-size:15px; line-height:1.5; color:var(--ink);
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px}

.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
.side{
  background:var(--paper);border-right:1px solid var(--line);padding:22px 14px 16px;
  display:flex;flex-direction:column;gap:16px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;
}
.brand{padding:0 8px}
.brand h1{margin:0;font-family:var(--hand);font-size:40px;line-height:1;font-weight:700}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.side-title{margin:4px 8px 0;font-weight:700;font-size:13px;color:var(--muted)}
.courses{display:flex;flex-direction:column;gap:4px}
.course-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;cursor:pointer;
  padding:10px 12px;border-radius:4px 12px 12px 4px;border:0;border-left:6px solid var(--cc);background:transparent;font-weight:600;
}
.course-item:hover{background:color-mix(in srgb,var(--cc) 9%,transparent)}
.course-item[aria-current="true"]{background:color-mix(in srgb,var(--cc) 16%,transparent)}
.ci-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-count{font-size:12px;color:var(--muted);font-weight:600}
.side-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 0;border-top:1px solid var(--line)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-weight:600;
  padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);white-space:nowrap;
}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:transparent}
.btn.wide{width:100%}
.badge{
  min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--margin);color:#fff;
  font-size:12px;font-weight:700;display:inline-grid;place-items:center;
}

.main{padding:26px clamp(14px,3vw,40px) 60px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:18px}
.course-name{
  flex:1 1 260px;min-width:0;font-family:var(--hand);font-size:clamp(32px,5vw,46px);font-weight:700;line-height:1.1;
  background:transparent;border:0;border-bottom:2px dashed transparent;padding:2px 0;color:var(--ink);
}
.course-name:hover,.course-name:focus{border-bottom-color:var(--line);outline:none}
.dots{display:flex;gap:6px;align-items:center}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.dot[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}

.tabs{display:flex;gap:4px;flex-wrap:wrap;align-items:flex-end}
.tab{
  cursor:pointer;padding:10px 18px 9px;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;
  background:color-mix(in srgb,var(--paper) 55%,var(--bg));font-weight:700;color:var(--muted);border-top:4px solid transparent;
}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);border-top-color:var(--c)}
.tab .n{font-size:12px;margin-left:6px;color:var(--muted);font-weight:600}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:0 14px 14px 14px;padding:16px;margin-bottom:0}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px}
.chip{
  cursor:pointer;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);
  font-weight:700;white-space:nowrap;flex:0 0 auto;
}
.chip[aria-current="true"]{background:var(--c);border-color:var(--c);color:#fff}
.chip.add{border-style:dashed;color:var(--muted)}

.page{
  position:relative;background:var(--paper);border:1px solid var(--line);border-radius:6px 16px 16px 6px;
  padding:22px 26px 26px 76px;box-shadow:0 14px 30px -20px rgba(20,30,60,.45);
}
.page::before{content:"";position:absolute;left:54px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.5}
.page::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:38px;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,var(--bg) 0 7px,transparent 8px) 0 0/38px 150px repeat-y;
}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.page-title{margin:0;font-family:var(--hand);font-size:44px;line-height:1;font-weight:700;color:var(--c)}
.title-in{
  width:100%;margin:10px 0 14px;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:transparent;
  font-size:19px;font-weight:700;
}
.title-in:focus{outline:none;border-bottom-color:var(--accent)}
.blocks{display:flex;flex-direction:column;gap:18px}
.block{position:relative}
.bctl{position:absolute;right:-6px;top:-14px;display:flex;gap:2px;opacity:0;transition:opacity .15s;z-index:3;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:2px}
.block:hover .bctl,.block:focus-within .bctl{opacity:1}
@media (hover:none){.bctl{opacity:1}}
.txt{
  display:block;width:100%;border:0;resize:none;background-color:transparent;overflow:hidden;min-height:96px;
  line-height:32px;padding:0 2px;
  background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-attachment:local;
}
.txt:focus{outline:none}
.add-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;padding-top:16px;border-top:1px dashed var(--line)}

.stage{position:relative;width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stage.grid{
  background-image:linear-gradient(rgba(47,91,234,.11) 1px,transparent 1px),linear-gradient(90deg,rgba(47,91,234,.11) 1px,transparent 1px);
  background-size:24px 24px;
}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;user-select:none}
.cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.tbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.tbar[hidden]{display:none}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.sep{width:1px;height:22px;background:var(--line)}
input[type=range]{width:90px;accent-color:var(--accent)}
.imgblock{display:flex;flex-direction:column;gap:8px}
.imgrow{display:flex;gap:8px;flex-wrap:wrap}
.dropzone{
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:30px 16px;cursor:pointer;
  border:2px dashed var(--line);border-radius:12px;color:var(--muted);
}
.dropzone:hover,.dropzone.over{border-color:var(--accent);color:var(--ink)}
.caption{
  width:100%;resize:none;overflow:hidden;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:color-mix(in srgb,#FFE066 14%,var(--paper));
}

.empty{max-width:520px;margin:8vh auto;text-align:center}
.empty h2{font-family:var(--hand);font-size:52px;margin:0 0 6px;line-height:1}
.empty p{color:var(--muted);margin:0 0 18px}
.note-empty{padding:34px 10px;text-align:center;color:var(--muted)}

.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:16px}
.tool{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px 16px;box-shadow:0 10px 24px -20px rgba(20,30,60,.5)}
.tool-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tool-h h3{margin:0;font-size:16px}
.in{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.calc-disp{width:100%;text-align:right;font-size:22px;font-weight:700;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.calc-res{text-align:right;min-height:24px;color:var(--muted);font-weight:600;margin:4px 2px 8px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.key{padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700;font-size:16px}
.key:hover{border-color:var(--muted)} .key.op{background:color-mix(in srgb,var(--c) 14%,var(--paper))} .key.eq{background:var(--c);color:#fff;border-color:transparent}
.hist{margin-top:8px;font-size:13px;color:var(--muted);display:grid;gap:2px}
.timer-disp{font-size:54px;font-weight:800;text-align:center;letter-spacing:.02em;font-variant-numeric:tabular-nums;margin:6px 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
.todo{display:flex;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px solid var(--rule)}
.todo input[type=checkbox]{width:18px;height:18px;accent-color:var(--c)}
.todo span{flex:1;min-width:0;overflow-wrap:anywhere}
.todo.done span{text-decoration:line-through;color:var(--muted)}
.formula{border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px;background:var(--bg)}
.formula input,.formula textarea{width:100%;border:0;background:transparent;padding:4px}
.formula input{font-weight:700}
.formula textarea{resize:vertical;min-height:44px;font-family:ui-monospace,Menlo,Consolas,monospace}
.add-tools{display:flex;flex-wrap:wrap;gap:8px}

.overlay{position:fixed;inset:0;background:rgba(8,12,26,.55);display:grid;place-items:center;padding:14px;z-index:50}
.dlg{background:var(--paper);border-radius:16px;width:min(540px,100%);max-height:92vh;overflow:auto;padding:22px;border:1px solid var(--line)}
.dlg h2{margin:0;font-size:22px}
.dlg-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-weight:700;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rem{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--rule)}
.rem .bar{width:5px;align-self:stretch;border-radius:3px;background:var(--cc)}
.rem .t{flex:1;min-width:0}
.rem .t b{overflow-wrap:anywhere}
.rem.done{opacity:.5}
.permrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:var(--bg);margin-bottom:16px}
.permrow p{margin:0;flex:1 1 200px}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 24px));display:grid;gap:8px;z-index:70}
.toast{background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 16px;border-left:6px solid var(--cc);cursor:pointer;box-shadow:0 12px 30px -8px rgba(0,0,0,.5)}
.toast-t{font-weight:700} .toast-b{font-size:13px;opacity:.8}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;max-height:none;padding:10px 12px;gap:8px;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;align-items:center}
  .brand{flex:1}
  .brand h1{font-size:32px} .brand p,.side-title{display:none}
  .courses{order:3;flex:1 0 100%;flex-direction:row;overflow-x:auto;padding-bottom:2px}
  .course-item{width:auto;flex:0 0 auto;border-left-width:0;border-bottom:4px solid var(--cc);border-radius:8px 8px 0 0;padding:8px 12px}
  .ci-count{display:none}
  .side-foot{margin:0;border:0;padding:0;order:2}
  .side .add-course span{display:none}
  .page{padding:18px 14px 20px 44px}
  .page::before{left:30px} .page::after{display:none}
  .page-title{font-size:36px}
  .two{grid-template-columns:1fr}
  .bctl{right:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><h1>Дэвтэр</h1><p>Хичээлийн тэмдэглэл, хэрэгсэл, сануулга</p></div>
    <div class="side-title">Миний хичээлүүд</div>
    <nav class="courses" id="courseList" aria-label="Хичээлүүд"></nav>
    <button type="button" class="btn add-course" id="addCourseBtn"></button>
    <div class="side-foot">
      <span class="muted small" id="status">Бэлэн</span>
      <span class="row" style="gap:2px">
        <button type="button" class="btn ghost sm" id="themeBtn" aria-label="Гэрэл / харанхуй горим солих" title="Гэрэл / харанхуй горим"></button>
        <button type="button" class="btn sm" id="bellBtn" aria-label="Сануулга"></button>
      </span>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="modal"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- constants & helpers ---------- */
const COLORS=['#2F5BEA','#D6303B','#1F8A57','#C25E0B','#7C4DDB','#0B8A8A','#C23A8A','#55647F'];
const LABEL={lecture:'Лекц',seminar:'Семинар',lab:'Лаборатори'};
const NEW_LABEL={lecture:'Шинэ лекц',seminar:'Шинэ семинар',lab:'Шинэ лаборатори'};
const TOOL_NAME={calc:'Тооцоолуур',timer:'Цаг хэмжигч',todo:'Даалгаврын жагсаалт',formulas:'Томьёоны сан'};
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const toLocalInput=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
const fmtDT=s=>{const d=new Date(s);return isNaN(d)?'':d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+'  '+pad(d.getHours())+':'+pad(d.getMinutes());};
const fmtDate=ts=>{const d=new Date(ts);return d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate());};

function h(tag,attrs,...kids){
  const e=document.createElement(tag); let val;
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false&&!k.startsWith('aria-')) continue;
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k==='value') val=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else if(v===true&&!k.startsWith('aria-')) e.setAttribute(k,'');
    else e.setAttribute(k,String(v));
  }
  for(const kid of kids.flat()){ if(kid==null||kid===false) continue; e.append(kid.nodeType?kid:document.createTextNode(kid)); }
  if(val!==undefined) e.value=val;
  return e;
}
const P={
  plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
  bell:'<path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 004 0"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',undo:'<path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3"/>',
  pen:'<path d="M4 20l4-1 11-11-3-3L5 16z"/>',hl:'<path d="M9 11l4 4M4 20h6l10-10-6-6L4 14z"/>',
  eraser:'<path d="M20 20H9L4 15l10-10 6 6-8 9"/>',
  img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 9"/>',
  up:'<path d="M6 15l6-6 6 6"/>',down:'<path d="M6 9l6 6 6-6"/>',moon:'<path d="M20 14A8 8 0 1110 4a6 6 0 0010 10z"/>',
  text:'<path d="M5 6h14M12 6v13M9 19h6"/>',draw:'<path d="M3 17c3-8 6 4 9-3s5-6 9-6"/>'
};
const ico=(n,s=18)=>'<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+P[n]+'</svg>';
const btn=(label,o={})=>h('button',{type:'button',class:'btn '+(o.cls||''),title:o.title,'aria-label':o.title||label,onclick:o.onclick,
  html:(o.icon?ico(o.icon,o.size||18):'')+(label?'<span>'+label+'</span>':'')});
function armed(b,fn){
  const orig=b.innerHTML; let t=null;
  b.addEventListener('click',()=>{
    if(b.dataset.armed){clearTimeout(t);fn();return;}
    b.dataset.armed='1';b.classList.add('danger');b.innerHTML=ico('trash')+'<span>Дахин дарж устгана</span>';
    t=setTimeout(()=>{delete b.dataset.armed;b.classList.remove('danger');b.innerHTML=orig;},3000);
  });
  return b;
}
const fit=ta=>{ta.style.height='auto';ta.style.height=Math.max(ta.scrollHeight,ta.classList.contains('txt')?96:0)+'px';};

/* ---------- storage (IndexedDB, falls back to memory) ---------- */
const Store={
  db:null,mem:null,
  init(){return new Promise(res=>{try{const rq=indexedDB.open('dewter-notebook',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('kv');rq.onsuccess=()=>{this.db=rq.result;res();};rq.onerror=()=>res();rq.onblocked=()=>res();}catch(e){res();}});},
  get(k){return new Promise(res=>{if(!this.db)return res(this.mem);try{const r=this.db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res();}catch(e){res();}});},
  set(k,v){return new Promise(res=>{if(!this.db){this.mem=v;return res(false);}try{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);tx.onabort=()=>res(false);}catch(e){res(false);}});}
};
let S={courses:[],reminders:[],activeCourse:null,theme:null};
const ui={tab:'lecture',notes:{}};
let saveT=null;
const setStatus=t=>{$('#status').textContent=t;};
function save(){
  setStatus('Хадгалж байна…');clearTimeout(saveT);
  saveT=setTimeout(async()=>{const ok=await Store.set('state',S);setStatus(ok?'Хадгалсан':'Түр санах ойд байна');},350);
}
const curCourse=()=>S.courses.find(c=>c.id===S.activeCourse)||null;

/* ---------- notifications, toast, beep ---------- */
let actx=null;
function audio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}return actx;}
function beep(){try{const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.3);}catch(e){}}
function toast(title,body,color){
  const t=h('div',{class:'toast',style:'--cc:'+(color||'var(--accent)')},h('div',{class:'toast-t'},title),body?h('div',{class:'toast-b'},body):null);
  t.addEventListener('click',()=>t.remove());$('#toasts').append(t);setTimeout(()=>t.remove(),9000);
}
function notify(title,body,color){
  toast(title,body,color);beep();
  try{if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body:body||''});}catch(e){}
}

/* ---------- sidebar ---------- */
function renderSide(){
  const list=$('#courseList');list.innerHTML='';
  S.courses.forEach(c=>{
    const cnt=c.notes.lecture.length+c.notes.seminar.length+c.notes.lab.length;
    list.append(h('button',{type:'button',class:'course-item',style:'--cc:'+c.color,'aria-current':c.id===S.activeCourse,
      onclick:()=>{S.activeCourse=c.id;ui.tab='lecture';save();renderSide();renderMain();}},
      h('span',{class:'ci-name'},c.name||'Нэргүй хичээл'),h('span',{class:'ci-count'},String(cnt))));
  });
}
function renderBell(){
  const n=S.reminders.filter(r=>!r.done).length;
  $('#bellBtn').innerHTML=ico('bell')+'<span>Сануулга</span>'+(n?'<span class="badge">'+n+'</span>':'');
}
function applyTheme(){
  if(S.theme) document.documentElement.setAttribute('data-theme',S.theme);else document.documentElement.removeAttribute('data-theme');
}

/* ---------- main view ---------- */

  const y=window.scrollY;const m=$('#main');m.innerHTML='';const c=curCourse();
  if(!c){
    m.append(h('div',{class:'empty'},h('h2',{},'Эхний хичээлээ нэмье'),
      h('p',{},'Хичээл бүрт лекц, семинар, лабораторийн тэмдэглэл, зураг, тооцоолуур зэрэг хэрэгслүүд тусдаа хадгалагдана.'),
      btn('Хичээл нэмэх',{icon:'plus',cls:'primary',onclick:openCourseDlg})));
    return;
  }
  m.style.setProperty('--c',c.color);
  const nameIn=h('input',{class:'course-name',value:c.name,placeholder:'Хичээлийн нэр','aria-label':'Хичээлийн нэр',
    oninput:()=>{c.name=nameIn.value;save();renderSide();}});
  const dots=h('div',{class:'dots',role:'group','aria-label':'Хичээлийн өнгө'},COLORS.map((col,i)=>h('button',{type:'button',class:'dot',style:'background:'+col,
    'aria-pressed':c.color===col,'aria-label':'Өнгө '+(i+1),onclick:()=>{c.color=col;save();renderSide();renderMain();}})));
  m.append(h('div',{class:'head'},nameIn,dots,armed(btn('Хичээл устгах',{icon:'trash',cls:'ghost sm'}),()=>{
    S.courses=S.courses.filter(x=>x.id!==c.id);S.reminders=S.reminders.filter(r=>r.courseId!==c.id);
    S.activeCourse=S.courses[0]?S.courses[0].id:null;save();renderSide();renderBell();renderMain();})));
  const tabs=h('div',{class:'tabs',role:'tablist'},['lecture','seminar','lab','tools'].map(k=>{
    const cnt=k==='tools'?c.tools.length:c.notes[k].length;
    return h('button',{type:'button',role:'tab',class:'tab','aria-selected':ui.tab===k,onclick:()=>{ui.tab=k;renderMain();}},
      k==='tools'?'Хэрэгсэл':LABEL[k],h('span',{class:'n'},String(cnt)));
  }));
  m.append(tabs);

/* ---------- notes ---------- */
function currentNote(c){
  if(ui.tab==='tools')return null;
  const list=c.notes[ui.tab];return list.find(x=>x.id===ui.notes[c.id+ui.tab])||list[0]||null;
}
function addNote(c,type){
  const n={id:uid(),title:'',created:Date.now(),blocks:[{id:uid(),type:'text',text:''}]};
  c.notes[type].push(n);ui.notes[c.id+type]=n.id;save();renderSide();renderMain();
}
function notesView(c,type){
  const list=c.notes[type];const cur=currentNote(c);
  const wrap=h('div',{});
  const chips=h('div',{class:'chips'},list.map((n,i)=>h('button',{type:'button',class:'chip','aria-current':cur&&n.id===cur.id,title:n.title||'',
    onclick:()=>{ui.notes[c.id+type]=n.id;renderMain();}},LABEL[type]+' '+(i+1))),
    h('button',{type:'button',class:'chip add',onclick:()=>addNote(c,type)},'+ '+NEW_LABEL[type]));
  wrap.append(h('div',{style:'height:14px'}),chips);
  if(!cur){
    wrap.append(h('div',{class:'panel note-empty'},'Энэ хичээлд '+LABEL[type].toLowerCase()+'ийн тэмдэглэл хараахан алга. "'+NEW_LABEL[type]+'" товчийг дарж эхний тэмдэглэлээ үүсгэнэ үү.'));
    return wrap;
  }
  wrap.append(editor(c,type,cur,list.indexOf(cur)));
  return wrap;
}
function editor(c,type,n,idx){
  const page=h('article',{class:'page'});
  page.append(h('div',{class:'page-head'},
    h('div',{},h('h2',{class:'page-title'},LABEL[type]+' '+(idx+1)),h('div',{class:'muted small'},fmtDate(n.created))),
    armed(btn('Тэмдэглэл устгах',{icon:'trash',cls:'ghost sm'}),()=>{
      c.notes[type]=c.notes[type].filter(x=>x.id!==n.id);save();renderSide();renderMain();})));
  const t=h('input',{class:'title-in',value:n.title,placeholder:'Сэдэв (заавал биш)','aria-label':'Сэдэв',oninput:()=>{n.title=t.value;save();}});
  page.append(t);
  const bl=h('div',{class:'blocks'});
  const paint=()=>{bl.innerHTML='';n.blocks.forEach((b,i)=>bl.append(blockEl(n,b,i,paint)));requestAnimationFrame(()=>bl.querySelectorAll('textarea').forEach(fit));};
  paint();page.append(bl);
  const add=(b)=>{n.blocks.push(b);save();paint();};
  page.append(h('div',{class:'add-row'},
    btn('Бичвэр нэмэх',{icon:'text',onclick:()=>{add({id:uid(),type:'text',text:''});const a=bl.querySelectorAll('textarea');if(a.length)a[a.length-1].focus();}}),
    btn('Зурах талбар нэмэх',{icon:'draw',onclick:()=>add({id:uid(),type:'draw',data:null})}),
    btn('Зураг оруулах',{icon:'img',onclick:()=>add({id:uid(),type:'image',src:null,overlay:null,caption:''})})));
  return page;
}
function blockEl(n,b,i,repaint){
  const mv=d=>{const j=i+d;if(j<0||j>=n.blocks.length)return;[n.blocks[i],n.blocks[j]]=[n.blocks[j],n.blocks[i]];save();repaint();};
  const wrap=h('section',{class:'block'});
  wrap.append(h('div',{class:'bctl'},
    btn('',{icon:'up',title:'Дээш зөөх',cls:'ghost sm',onclick:()=>mv(-1)}),
    btn('',{icon:'down',title:'Доош зөөх',cls:'ghost sm',onclick:()=>mv(1)}),
    armed(btn('',{icon:'trash',title:'Блок устгах',cls:'ghost sm'}),()=>{n.blocks=n.blocks.filter(x=>x.id!==b.id);save();repaint();})));
  if(b.type==='text'){
    const ta=h('textarea',{class:'txt',placeholder:'Энд бичнэ үү…','aria-label':'Тэмдэглэл',value:b.text||'',oninput:()=>{b.text=ta.value;fit(ta);save();}});
    wrap.append(ta);
  }else if(b.type==='draw'){
    const d=drawer(b,'data',1200,700,{enabled:true,color:'#1B2540'});
    const st=h('div',{class:'stage grid',style:'aspect-ratio:1200/700'},d.cv);
    wrap.append(d.bar,st);
  }else{
    wrap.append(imageBlock(n,b,repaint));
  }
  return wrap;
}

/* ---------- drawing ---------- */
function drawer(b,key,W,H,o){
  const cv=h('canvas',{class:'cv',width:W,height:H});const ctx=cv.getContext('2d');
  if(b[key]){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,W,H);im.src=b[key];}
  const INK='#1B2540',YEL='#FFD84D';
  const st={tool:'pen',color:o.color||INK,size:3};
  const undo=[];let snap=null,pts=[],drawing=false,scale=1,enabled=!!o.enabled;
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height,s:W/r.width};};
  function stroke(){
    ctx.putImageData(snap,0,0);ctx.lineCap='round';ctx.lineJoin='round';
    if(st.tool==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.strokeStyle='#000';ctx.lineWidth=st.size*4*scale;ctx.globalAlpha=1;}
    else if(st.tool==='hl'){ctx.globalCompositeOperation='source-over';ctx.strokeStyle=st.color;ctx.lineWidth=st.size*4*scale;ctx.globalAlpha=.4;}
    else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=st.color;ctx.lineWidth=st.size*scale;ctx.globalAlpha=1;}
    ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
    if(pts.length===1)ctx.lineTo(pts[0].x+.01,pts[0].y);
    for(let i=1;i<pts.length-1;i++){const m={x:(pts[i].x+pts[i+1].x)/2,y:(pts[i].y+pts[i+1].y)/2};ctx.quadraticCurveTo(pts[i].x,pts[i].y,m.x,m.y);}
    if(pts.length>1)ctx.lineTo(pts[pts.length-1].x,pts[pts.length-1].y);
    ctx.stroke();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  }
  const commit=()=>{b[key]=cv.toDataURL('image/png');save();};
  cv.addEventListener('pointerdown',e=>{
    if(!enabled||(e.pointerType==='mouse'&&e.button!==0))return;
    e.preventDefault();cv.setPointerCapture(e.pointerId);
    snap=ctx.getImageData(0,0,W,H);undo.push(snap);if(undo.length>25)undo.shift();
    const p=pos(e);scale=p.s;pts=[p];drawing=true;stroke();
  });
  cv.addEventListener('pointermove',e=>{if(!drawing)return;pts.push(pos(e));stroke();});
  const end=()=>{if(!drawing)return;drawing=false;commit();};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  function setEnabled(v){enabled=v;cv.style.pointerEvents=v?'auto':'none';cv.style.touchAction=v?'none':'auto';cv.style.cursor=v?'crosshair':'default';}
  setEnabled(enabled);

  const bar=h('div',{class:'tbar'});
  const tdefs=[['pen','Үзэг'],['hl','Тодруулагч'],['eraser','Баллуур']];
  const tb=tdefs.map(([k,l])=>btn(l,{icon:k,cls:'sm',onclick:()=>setTool(k)}));
  const sws=['#1B2540','#2F5BEA','#D6303B','#1F8A57','#F08A24',YEL].map(col=>h('button',{type:'button',class:'sw',style:'background:'+col,title:col,'aria-label':'Өнгө '+col,onclick:()=>{st.color=col;sync();}}));
  const size=h('input',{type:'range',min:1,max:12,value:String(st.size),'aria-label':'Зузаан',oninput:()=>{st.size=+size.value;}});
  function sync(){tb.forEach((x,i)=>x.setAttribute('aria-pressed',String(tdefs[i][0]===st.tool)));sws.forEach(s=>s.setAttribute('aria-pressed',String(s.title.toLowerCase()===st.color.toLowerCase())));}
  function setTool(k){st.tool=k;if(k==='hl'&&st.color.toLowerCase()===INK.toLowerCase())st.color=YEL;if(k==='pen'&&st.color.toLowerCase()===YEL.toLowerCase())st.color=o.color||INK;sync();}
  bar.append(tb,h('span',{class:'sep'}),sws,h('span',{class:'sep'}),size,
    btn('Буцаах',{icon:'undo',cls:'sm',onclick:()=>{const s=undo.pop();if(s){ctx.putImageData(s,0,0);commit();}}}),
    btn('Цэвэрлэх',{icon:'trash',cls:'sm',onclick:()=>{undo.push(ctx.getImageData(0,0,W,H));ctx.clearRect(0,0,W,H);commit();}}));
  sync();
  return{cv,bar,setEnabled};
}
function loadImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();
      im.onload=()=>{const k=Math.min(1,1400/Math.max(im.naturalWidth,im.naturalHeight));const w=Math.round(im.naturalWidth*k),hh=Math.round(im.naturalHeight*k);
        const c=document.createElement('canvas');c.width=w;c.height=hh;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,hh);x.drawImage(im,0,0,w,hh);
        res({src:c.toDataURL('image/jpeg',.85),w:w,h:hh});};
      im.onerror=rej;im.src=fr.result;};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}
function imageBlock(n,b,repaint){
  const box=h('div',{class:'imgblock'});
  if(!b.src){
    const pick=async f=>{if(!f||!f.type.startsWith('image/'))return toast('Зураг биш байна','PNG, JPG зэрэг зургийн файл сонгоно уу.');
      try{Object.assign(b,await loadImage(f));b.overlay=null;save();repaint();}catch(e){toast('Зургийг уншиж чадсангүй','Өөр файл оролдоно уу.');}};
    const inp=h('input',{type:'file',accept:'image/*',hidden:true,onchange:()=>pick(inp.files[0])});
    const dz=h('label',{class:'dropzone'},inp,h('span',{html:ico('img',30)}),h('strong',{},'Зураг сонгох'),
      h('span',{class:'small'},'эсвэл энд чирж тавина уу. Дэлгэцийн зургаа Ctrl+V (Mac дээр ⌘V) даран шууд буулгаж болно.'));
    dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over');});
    dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
    dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');pick(e.dataTransfer.files[0]);});
    box.append(dz);return box;
  }
  const d=drawer(b,'overlay',b.w,b.h,{enabled:false,color:'#D6303B'});
  d.bar.hidden=true;let on=false;
  const tg=btn('Зураг дээр зурах',{icon:'pen',onclick:()=>{on=!on;d.setEnabled(on);d.bar.hidden=!on;tg.classList.toggle('primary',on);tg.querySelector('span').textContent=on?'Зурж дуусгах':'Зураг дээр зурах';}});
  const stage=h('div',{class:'stage',style:'aspect-ratio:'+b.w+'/'+b.h},h('img',{src:b.src,alt:b.caption||'Оруулсан зураг',draggable:'false'}),d.cv);
  const cap=h('textarea',{class:'caption',rows:2,placeholder:'Зургийн тайлбар: юуг харуулж байна, юуг анхаарах вэ…','aria-label':'Зургийн тайлбар',value:b.caption||'',oninput:()=>{b.caption=cap.value;fit(cap);save();}});
  box.append(h('div',{class:'imgrow'},tg),d.bar,stage,cap);
  requestAnimationFrame(()=>fit(cap));
  return box;
}
document.addEventListener('paste',async e=>{
  const c=curCourse();if(!c)return;const n=currentNote(c);if(!n)return;
  const f=[...((e.clipboardData&&e.clipboardData.files)||[])].find(x=>x.type.startsWith('image/'));if(!f)return;
  e.preventDefault();
  try{const r=await loadImage(f);n.blocks.push({id:uid(),type:'image',src:r.src,w:r.w,h:r.h,overlay:null,caption:''});save();renderMain(true);toast('Зураг нэмэгдлээ','Доор нь тайлбар бичиж, дээр нь зурж болно.',c.color);}catch(err){}
});

/* ---------- tools ---------- */
const timers={};
const fmtTime=s=>pad(Math.floor(s/60))+':'+pad(s%60);
function findTool(id){for(const c of S.courses){const t=c.tools.find(x=>x.id===id);if(t)return{c,t};}return{};}
function toolsView(c){
  const wrap=h('div',{class:'panel'});
  const defaults={calc:()=>({hist:[]}),timer:()=>({minutes:25}),todo:()=>({items:[]}),formulas:()=>({items:[]})};
  wrap.append(h('div',{class:'add-tools'},h('strong',{style:'align-self:center;margin-right:4px'},'Хэрэгсэл нэмэх:'),
    Object.keys(TOOL_NAME).map(k=>btn(TOOL_NAME[k],{icon:'plus',cls:'sm',onclick:()=>{c.tools.push({id:uid(),type:k,data:defaults[k]()});save();renderMain(true);}}))));
  if(!c.tools.length){wrap.append(h('div',{class:'note-empty'},'Энэ хичээлд туслах хэрэгсэл хараахан алга. Дээрээс хэрэгтэй хэрэгслээ сонгоно уу.'));return wrap;}
  const grid=h('div',{class:'tools-grid'});
  c.tools.forEach(t=>{
    const body=t.type==='calc'?calcTool(t):t.type==='timer'?timerTool(t):t.type==='todo'?todoTool(t,c):formulaTool(t);
    grid.append(h('div',{class:'tool'},h('div',{class:'tool-h'},h('h3',{},TOOL_NAME[t.type]),
      armed(btn('',{icon:'trash',title:'Хэрэгсэл устгах',cls:'ghost sm'}),()=>{c.tools=c.tools.filter(x=>x.id!==t.id);delete timers[t.id];save();renderMain(true);})),body));
  });
  wrap.append(grid);return wrap;
}
function calcTool(t){
  const disp=h('input',{class:'calc-disp',value:'',inputmode:'decimal','aria-label':'Илэрхийлэл',placeholder:'0'});
  const res=h('div',{class:'calc-res'});const hist=h('div',{class:'hist'});
  const showHist=()=>{hist.innerHTML='';t.data.hist.slice(-4).reverse().forEach(x=>hist.append(h('div',{},x)));};
  const evalExpr=s=>{
    const e=s.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/\^/g,'**').replace(/,/g,'.').replace(/√/g,'Math.sqrt').replace(/π/g,'Math.PI');
    if(!/^[0-9+\-*/().%\s]*$/.test(e.replace(/Math\.sqrt/g,'').replace(/Math\.PI/g,'')))throw 0;
    const v=Function('"use strict";return ('+e+')')();if(typeof v!=='number'||!isFinite(v))throw 0;return v;
  };
  const preview=()=>{try{res.textContent=disp.value.trim()?'= '+(+evalExpr(disp.value).toPrecision(12)):'';}catch(e){res.textContent='';}};
  const equals=()=>{try{const v=+evalExpr(disp.value).toPrecision(12);t.data.hist.push(disp.value+' = '+v);t.data.hist=t.data.hist.slice(-20);disp.value=String(v);res.textContent='';showHist();save();}catch(e){res.textContent='Илэрхийллийг шалгана уу';}};
  disp.addEventListener('input',preview);disp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();equals();}});
  const rows=[['C','(',')','⌫'],['7','8','9','÷'],['4','5','6','×'],['1','2','3','−'],['0','.','^','+'],['√','π','x²','=']];
  const keys=h('div',{class:'keys'});
  rows.flat().forEach(k=>{
    const op='÷×−+^√x²()'.includes(k)||k==='⌫'||k==='C';
    keys.append(h('button',{type:'button',class:'key'+(k==='='?' eq':op?' op':''),onclick:()=>{
      if(k==='C'){disp.value='';res.textContent='';}
      else if(k==='⌫')disp.value=disp.value.slice(0,-1);
      else if(k==='=')return equals();
      else if(k==='√')disp.value+='√(';
      else if(k==='x²')disp.value+='^2';
      else disp.value+=k;
      preview();}},k));
  });
  showHist();return h('div',{},disp,res,keys,hist);
}
function timerTool(t){
  const st=timers[t.id]||(timers[t.id]={left:t.data.minutes*60,running:false,end:0});
  const disp=h('div',{class:'timer-disp',id:'tm-'+t.id,role:'timer'},fmtTime(st.left));
  const go=btn(st.running?'Түр зогсоох':'Эхлэх',{cls:'primary',onclick:()=>{
    audio();
    if(st.running){st.left=Math.max(0,Math.ceil((st.end-Date.now())/1000));st.running=false;}
    else{if(st.left<=0)st.left=t.data.minutes*60;st.end=Date.now()+st.left*1000;st.running=true;}
    go.querySelector('span').textContent=st.running?'Түр зогсоох':'Эхлэх';disp.textContent=fmtTime(st.left);}});
  const reset=btn('Дахин эхлүүлэх',{onclick:()=>{st.running=false;st.left=t.data.minutes*60;disp.textContent=fmtTime(st.left);go.querySelector('span').textContent='Эхлэх';}});
  const presets=h('div',{class:'row c',style:'margin-top:12px'},[5,15,25,45,60].map(m=>btn(m+' мин',{cls:'sm',onclick:()=>{t.data.minutes=m;save();if(!st.running){st.left=m*60;disp.textContent=fmtTime(st.left);}}})));
  return h('div',{},disp,h('div',{class:'row c'},go,reset),presets);
}
function todoTool(t,c){
  const list=h('div',{});
  const paint=()=>{list.innerHTML='';t.data.items.forEach(it=>{
    const cb=h('input',{type:'checkbox','aria-label':'Дууссан','aria-checked':it.done,onchange:()=>{it.done=cb.checked;save();paint();}});cb.checked=!!it.done;
    list.append(h('div',{class:'todo'+(it.done?' done':''),style:'--c:'+c.color},cb,h('span',{},it.text),
      btn('',{icon:'x',title:'Устгах',cls:'ghost sm',onclick:()=>{t.data.items=t.data.items.filter(x=>x.id!==it.id);save();paint();}})));});};
  const inp=h('input',{class:'in',placeholder:'Даалгавар нэмээд Enter дарна уу…','aria-label':'Шинэ даалгавар',
    onkeydown:e=>{if(e.key==='Enter'&&inp.value.trim()){t.data.items.push({id:uid(),text:inp.value.trim(),done:false});inp.value='';save();paint();}}});
  paint();return h('div',{},inp,list);
}
function formulaTool(t){
  const list=h('div',{});
  const paint=()=>{list.innerHTML='';t.data.items.forEach(it=>{
    const ti=h('input',{placeholder:'Нэр (жишээ: Ньютоны 2-р хууль)','aria-label':'Томьёоны нэр',value:it.title||'',oninput:()=>{it.title=ti.value;save();}});
    const bo=h('textarea',{placeholder:'F = m·a','aria-label':'Томьёо',value:it.body||'',oninput:()=>{it.body=bo.value;save();}});
    list.append(h('div',{class:'formula'},ti,bo,h('div',{class:'row',style:'justify-content:flex-end'},
      btn('Устгах',{icon:'trash',cls:'ghost sm',onclick:()=>{t.data.items=t.data.items.filter(x=>x.id!==it.id);save();paint();}}))));});};
  paint();return h('div',{},btn('Томьёо нэмэх',{icon:'plus',cls:'sm wide',onclick:()=>{t.data.items.push({id:uid(),title:'',body:''});save();paint();}}),list);
}

/* ---------- dialogs ---------- */
let modal=null;
function openModal(build,kind){
  closeModal();const ov=h('div',{class:'overlay',onmousedown:e=>{if(e.target===ov)closeModal();}});
  const dlg=h('div',{class:'dlg',role:'dialog','aria-modal':'true'});ov.append(dlg);$('#modal').append(ov);modal={ov,dlg,build,kind};build(dlg);
  const f=dlg.querySelector('input,select');if(f)f.focus();
}
function closeModal(){$('#modal').innerHTML='';modal=null;}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal();});

function openCourseDlg(){
  openModal(dlg=>{
    dlg.setAttribute('aria-label','Хичээл нэмэх');let color=COLORS[S.courses.length%COLORS.length];
    const nm=h('input',{class:'in',placeholder:'Жишээ: Математик анализ','aria-label':'Хичээлийн нэр',onkeydown:e=>{if(e.key==='Enter')create();}});
    const dots=h('div',{class:'dots'});
    const paint=()=>{dots.innerHTML='';COLORS.forEach((col,i)=>dots.append(h('button',{type:'button',class:'dot',style:'background:'+col,'aria-pressed':col===color,'aria-label':'Өнгө '+(i+1),onclick:()=>{color=col;paint();}})));};
    const create=()=>{
      const c={id:uid(),name:nm.value.trim()||'Шинэ хичээл',color,notes:{lecture:[],seminar:[],lab:[]},tools:[]};
      S.courses.push(c);S.activeCourse=c.id;ui.tab='lecture';save();closeModal();renderSide();renderMain();
    };
    paint();
    dlg.append(h('div',{class:'dlg-h'},h('h2',{},'Хичээл нэмэх'),btn('',{icon:'x',title:'Хаах',cls:'ghost',onclick:closeModal})),
      h('div',{class:'field'},h('label',{},'Хичээлийн нэр'),nm),h('div',{class:'field'},h('label',{},'Өнгө'),dots),
      btn('Хичээл нэмэх',{cls:'primary wide',onclick:create}));
  });
}
function openReminders(){
  openModal(dlg=>{
    dlg.setAttribute('aria-label','Сануулга');dlg.innerHTML='';
    const supported='Notification' in window;const perm=supported?Notification.permission:'unsupported';
    const permTxt=perm==='granted'?'Мэдэгдэл асаалттай байна.':perm==='denied'?'Мэдэгдэл хөтөч дээр хаалттай байна. Хаягийн мөрний түгжээ дээрээс зөвшөөрнө үү.':perm==='unsupported'?'Энэ хөтөч мэдэгдэл дэмжихгүй тул апп доторх сануулга ажиллана.':'Компьютерийн мэдэгдэл авахын тулд зөвшөөрөл өгнө үү.';
    const permRow=h('div',{class:'permrow'},h('p',{class:'small'},permTxt+' Сануулга нь апп нээлттэй (tab хаагдаагүй) үед ажиллана.'),
      perm==='default'?btn('Мэдэгдэл асаах',{cls:'primary sm',onclick:()=>{Notification.requestPermission().then(()=>openReminders());}}):null,
      btn('Шалгах',{cls:'sm',onclick:()=>notify('Туршилтын сануулга','Мэдэгдэл ажиллаж байна.')}));
    const title=h('input',{class:'in',placeholder:'Жишээ: Лабораторийн тайлан хураалгах','aria-label':'Юу сануулах вэ'});
    const csel=h('select',{class:'in','aria-label':'Хичээл'},h('option',{value:''},'Хичээл сонгоогүй'),S.courses.map(c=>h('option',{value:c.id},c.name)));
    if(S.activeCourse)csel.value=S.activeCourse;
    const d0=new Date();d0.setHours(d0.getHours()+1,0,0,0);
    const when=h('input',{class:'in',type:'datetime-local',value:toLocalInput(d0),'aria-label':'Хэзээ'});
    const rep=h('select',{class:'in','aria-label':'Давтах'},h('option',{value:'none'},'Нэг удаа'),h('option',{value:'daily'},'Өдөр бүр'),h('option',{value:'weekly'},'7 хоног бүр'));
    const list=h('div',{});
    const paintList=()=>{list.innerHTML='';
      const rs=[...S.reminders].sort((a,b)=>(a.done-b.done)||(new Date(a.at)-new Date(b.at)));
      if(!rs.length)list.append(h('p',{class:'muted small'},'Сануулга хараахан алга.'));
      rs.forEach(r=>{const c=S.courses.find(x=>x.id===r.courseId);
        list.append(h('div',{class:'rem'+(r.done?' done':''),style:'--cc:'+(c?c.color:'var(--line)')},h('div',{class:'bar'}),
          h('div',{class:'t'},h('b',{},r.title),h('div',{class:'muted small'},fmtDT(r.at)+(r.repeat==='daily'?' · өдөр бүр':r.repeat==='weekly'?' · 7 хоног бүр':'')+(c?' · '+c.name:'')+(r.done?' · дууссан':''))),
          btn('',{icon:'trash',title:'Устгах',cls:'ghost sm',onclick:()=>{S.reminders=S.reminders.filter(x=>x.id!==r.id);save();renderBell();paintList();}})));});};
    const add=()=>{
      if(!title.value.trim()){title.focus();return toast('Гарчиг хоосон байна','Юу сануулахыг бичнэ үү.');}
      if(!when.value){when.focus();return toast('Хугацаа сонгоно уу');}
      S.reminders.push({id:uid(),title:title.value.trim(),courseId:csel.value||null,at:when.value,repeat:rep.value,done:false});
      save();renderBell();title.value='';paintList();
    };
    dlg.append(h('div',{class:'dlg-h'},h('h2',{},'Сануулга'),btn('',{icon:'x',title:'Хаах',cls:'ghost',onclick:closeModal})),permRow,
      h('div',{class:'field'},h('label',{},'Юу сануулах вэ?'),title),
      h('div',{class:'two'},h('div',{class:'field'},h('label',{},'Хичээл'),csel),h('div',{class:'field'},h('label',{},'Давтах'),rep)),
      h('div',{class:'field'},h('label',{},'Хэзээ'),when),
      btn('Сануулга нэмэх',{icon:'plus',cls:'primary wide',onclick:add}),
      h('h3',{style:'margin:22px 0 4px;font-size:16px'},'Миний сануулгууд'),list);
    paintList();
  },'rem');
}

/* ---------- ticker (reminders + timers) ---------- */
function tick(){
  const now=Date.now();let changed=false;
  for(const r of S.reminders){
    if(r.done)continue;const t=new Date(r.at).getTime();if(isNaN(t)||t>now)continue;
    const c=S.courses.find(x=>x.id===r.courseId);notify(r.title,c?c.name:'Сануулга',c?c.color:null);changed=true;
    if(r.repeat==='none')r.done=true;else{const step=r.repeat==='daily'?864e5:6048e5;let nx=t;while(nx<=now)nx+=step;r.at=toLocalInput(new Date(nx));}
  }
  if(changed){save();renderBell();if(modal&&modal.kind==='rem')modal.build(modal.dlg);}
  for(const id in timers){
    const st=timers[id];if(!st.running)continue;
    st.left=Math.max(0,Math.ceil((st.end-now)/1000));
    const el=document.getElementById('tm-'+id);if(el)el.textContent=fmtTime(st.left);
    if(st.left<=0){st.running=false;const f=findTool(id);notify('Цаг дууслаа',f.c?f.c.name:'',f.c?f.c.color:null);if(el&&ui.tab==='tools')renderMain(true);}
  }
}

/* ---------- boot ---------- */
async function boot(){
  await Promise.race([Store.init(),new Promise(r=>setTimeout(r,1500))]);
  let saved;try{saved=await Store.get('state');}catch(e){}
  if(saved&&Array.isArray(saved.courses)){
    S=Object.assign({courses:[],reminders:[],activeCourse:null,theme:null},saved);
    S.courses.forEach(c=>{c.notes=c.notes||{};['lecture','seminar','lab'].forEach(k=>c.notes[k]=c.notes[k]||[]);c.tools=c.tools||[];});
    if(!S.courses.find(c=>c.id===S.activeCourse))S.activeCourse=S.courses[0]?S.courses[0].id:null;
  }
  $('#addCourseBtn').innerHTML=ico('plus')+'<span>Хичээл нэмэх</span>';
  $('#themeBtn').innerHTML=ico('moon');
  $('#themeBtn').addEventListener('click',()=>{
    const dark=S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    S.theme=dark?'light':'dark';applyTheme();save();
  });
  $('#addCourseBtn').addEventListener('click',openCourseDlg);
  $('#bellBtn').addEventListener('click',openReminders);
  applyTheme();renderSide();renderBell();renderMain();setStatus('Бэлэн');
  setInterval(tick,1000);
}
boot();
})();
</script>
